    <style>
      html, body { margin: 0; background: #0E110C; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0E110C; transition: opacity .5s cubic-bezier(.16,1,.3,1);
      }
      #boot span {
        display: grid; place-items: center; width: 56px; height: 56px;
        border: 1px solid #2C3326; border-radius: 50%;
        font: 500 20px/1 system-ui, sans-serif; color: #EEF0E4; letter-spacing: -.02em;
        position: relative;
      }
      #boot span::after {
        content: ""; position: absolute; inset: -1px; border-radius: 50%;
        border: 1px solid transparent; border-top-color: #C5F04A;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot span::after { animation: none; } }
      @media (prefers-color-scheme: light) {
        html, body, #boot { background: #0E110C; }
      }
    </style>
